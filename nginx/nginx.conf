# ==============================================================================
# [API GATEWAY: NGINX] Central Entrypoint & Path-Based Microservice Router
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    # Microservice Upstream Pools
    upstream auth_service {
        server auth-service:3001;
    }

    upstream account_service {
        server account-service:3002;
    }

    upstream transaction_service {
        server transaction-service:3003;
    }

    server {
        # API Gateway listens on standard ports (Port 80 & Port 3000)
        listen 80;
        listen 3000;

        # Standard Gateway Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 1. Route to Auth Microservice
        location /api/auth {
            proxy_pass http://auth_service;
        }

        # 2. Route to Account Microservice
        location /api/accounts {
            proxy_pass http://account_service;
        }

        # 3. Route to Transaction & Webhook Microservice
        location /api/transactions {
            proxy_pass http://transaction_service;
        }

        location /api/webhooks {
            proxy_pass http://transaction_service;
        }

        # 4. Route to AI Financial Advisor, RAG & Chat Assistant
        location /api/ai {
            proxy_pass http://transaction_service;
        }

        location /ai {
            proxy_pass http://transaction_service;
        }

        # 4. Gateway Health Check & Root
        location /api/health {
            proxy_pass http://auth_service;
        }

        location / {
            return 200 '{"gateway":"VaultX API Gateway","status":"online","services":["auth-service:3001","account-service:3002","transaction-service:3003"]}';
            add_header Content-Type application/json;
        }
    }
}
