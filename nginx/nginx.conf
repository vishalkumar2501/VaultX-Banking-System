# ==============================================================================
# NGINX Load Balancer Configuration for Horizontal Scaling
# ==============================================================================
# Reverse Proxy & Load Balancer:
#   Requests (Port 80 ya 3000) ---> NGINX ---> Round-Robin ---> [backend replicas]
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    # Upstream block: saare backend containers ka pool
    # Docker Compose me 'backend:3000' saare scaled containers par point karta hai
    upstream backend_cluster {
        # Default Algorithm: Round-Robin (Har request next container ko jayegi)
        # Other algorithms (Interview Knowledge):
        #   least_conn; # Jis container ke paas sabse kam active connections hon
        #   ip_hash;    # Same client IP hamesha same container par jayegi
        server backend:3000;
    }

    server {
        # Listen on Port 80 (Standard Web Port) AND Port 3000 (Existing API Port)
        listen 80;
        listen 3000;

        location / {
            # Traffic ko upstream backend_cluster me bhejo
            proxy_pass http://backend_cluster;

            # Real client headers forward karo (Rate limiter aur logging ke liye zaroori)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Connection timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
