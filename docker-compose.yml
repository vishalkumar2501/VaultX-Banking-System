services:
  # ----------------------------------------------------------------------------
  # 1. Database (MongoDB Replica Set for ACID Transactions)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: vaultx-db
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - vaultx_mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - |
          try {
            if (rs.status().myState === 1) quit(0);
            quit(1);
          } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
            quit(1);
          }
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Redis (Cache, OTP, Rate Limiting & BullMQ Queue)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vaultx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vaultx_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Microservice: Auth Service (Register, Login, Logout, OTP)
  # ----------------------------------------------------------------------------
  auth-service:
    build: .
    container_name: vaultx-auth-service
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - .env
    environment:
      SERVICE_NAME: "auth"
      PORT: "3001"
      MONGO_URI: "mongodb://mongodb:27017/vaultx?replicaSet=rs0"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 4. Microservice: Account Service (Create Account, Fetch Accounts, Balance)
  # ----------------------------------------------------------------------------
  account-service:
    build: .
    container_name: vaultx-account-service
    restart: unless-stopped
    expose:
      - "3002"
    env_file:
      - .env
    environment:
      SERVICE_NAME: "account"
      PORT: "3002"
      MONGO_URI: "mongodb://mongodb:27017/vaultx?replicaSet=rs0"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 5. Microservice: Transaction Service (Transfers, Ledger, Webhooks)
  # ----------------------------------------------------------------------------
  transaction-service:
    build: .
    container_name: vaultx-transaction-service
    restart: unless-stopped
    expose:
      - "3003"
    env_file:
      - .env
    environment:
      SERVICE_NAME: "transaction"
      PORT: "3003"
      MONGO_URI: "mongodb://mongodb:27017/vaultx?replicaSet=rs0"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 6. API Gateway: Nginx (Central Reverse Proxy Routing to Microservices)
  # ----------------------------------------------------------------------------
  api-gateway:
    image: nginx:alpine
    container_name: vaultx-api-gateway
    restart: unless-stopped
    ports:
      - "80:80"     # Standard HTTP Port
      - "3000:3000" # Backward compatible for all existing client/Postman calls
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - account-service
      - transaction-service

  # ----------------------------------------------------------------------------
  # 7. Qdrant Vector Database (Vector Storage for Bank Policy RAG & Embeddings)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vaultx-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - vaultx_qdrant_data:/qdrant/storage

volumes:
  vaultx_mongo_data:
  vaultx_redis_data:
  vaultx_qdrant_data:
