services:
  # 1. MongoDB (Banking transactions ke liye replica set rs0 zaroori hai)
  mongodb:
    image: mongo:7
    container_name: vaultx-db
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - vaultx_mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - |
          try {
            if (rs.status().myState === 1) quit(0);
            quit(1);
          } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
            quit(1);
          }
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # 2. Redis
  redis:
    image: redis:7-alpine
    container_name: vaultx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vaultx_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Node.js Backend (Horizontally Scalable Replicas)
  backend:
    build: .
    restart: unless-stopped
    # Multiple replicas chalane ke liye port 3000 internal network par expose kiya hai
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      MONGO_URI: "mongodb://mongodb:27017/vaultx?replicaSet=rs0"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. NGINX Load Balancer (Horizontal Scaling Gateway)
  nginx:
    image: nginx:alpine
    container_name: vaultx-loadbalancer
    restart: unless-stopped
    ports:
      - "80:80"     # Standard HTTP Port
      - "3000:3000" # Existing client/Postman port backward-compatible
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  vaultx_mongo_data:
  vaultx_redis_data:
